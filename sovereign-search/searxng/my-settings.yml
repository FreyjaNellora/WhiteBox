# Sovereign Search — local, private SearXNG config
# Generated by setup. Bind is localhost-only; not internet-facing.
use_default_settings: true
general:
  instance_name: "Sovereign Search"
  debug: false
server:
  # REQUIRED: set your OWN random secret before first run. Generate one with:
  #   python -c "import secrets; print(secrets.token_hex(32))"
  secret_key: "CHANGE_ME_generate_a_random_64_hex_string"
  bind_address: "127.0.0.1"
  port: 8888
  limiter: false
  public_instance: false
search:
  safe_search: 0
  formats:
    - html
    - json
# --- Credibility layer (applies across all engines via the hostnames plugin) ---
hostnames:
  remove:
    - '(.*\.)?pinterest\.[a-z.]+$'
    - '(.*\.)?quora\.com$'
  low_priority:
    - '(.*\.)?forbes\.com$'
    - '(.*\.)?facebook\.com$'
    - '(.*\.)?instagram\.com$'
    - '(.*\.)?tiktok\.com$'
    - '(.*\.)?x\.com$'
    - '(.*\.)?twitter\.com$'
    - '(.*\.)?medium\.com$'
    - '(.*\.)?buzzfeed\.com$'
    - '(.*\.)?businessinsider\.com$'
    - '(.*\.)?wikihow\.com$'
    - '(.*\.)?msn\.com$'
    - '(.*\.)?yahoo\.com$'
  high_priority:
    - '\.gov$'
    - '\.edu$'
    - '\.ac\.uk$'
    - '(.*\.)?loc\.gov$'
    - '(.*\.)?arxiv\.org$'
    - '(.*\.)?nature\.com$'
    - '(.*\.)?sciencedirect\.com$'
    - '(.*\.)?cell\.com$'
    - '(.*\.)?jstor\.org$'
    - '(.*\.)?springer\.com$'
    - '(.*\.)?wikipedia\.org$'
    - '(.*\.)?gutenberg\.org$'
# --- IndieWeb / small-web focus: surface independent sites the mainstream engines bury.
# Merged into (not replacing) the default engine list, so mainstream stays for balance.
engines:
  # --- Academic tier: retrieval engines so research papers actually surface.
  # The indie-web / creative engine list (searchmysite, wiby, mwmbl, github, ...)
  # is great at surfacing independent sites but structurally can't return a
  # research paper. arxiv.org was already in high_priority (ranked up) yet no
  # enabled engine could fetch papers -- these engines add the retrieval side.
  - name: arxiv
    disabled: false
  - name: semantic scholar
    disabled: false
  - name: crossref
    disabled: false
  - name: openalex
    disabled: false
  - name: pubmed
    disabled: false
  # NOT enabled, and the reason matters more than the omission:
  #   base  — commented out in searxng's own defaults ("tmp suspended: dh key
  #           too small"), so there is no entry to override; naming it would
  #           be a new engine definition with no `engine:` key and would fail
  #           at startup.
  #   core  — its settings name is `core.ac.uk`, not `core`, and it needs an
  #           API key.
  # Caught by checking both against searx/settings.yml before restarting a
  # service two agents were mid-flight against.
  - name: searchmysite
    disabled: false
    weight: 3
  - name: wiby
    disabled: false
    weight: 3
  - name: mwmbl
    disabled: false
    weight: 2
  - name: mojeek
    disabled: false
    weight: 2
  # people-finding engines (People mode; these live in non-general categories, so normal search is unaffected)
  - name: mastodon users
    disabled: false
  - name: github
    disabled: false
  - name: gitlab
    disabled: false
  - name: codeberg
    disabled: false
  - name: lemmy users
    disabled: false
  - name: bandcamp
    disabled: false
  - name: soundcloud
    disabled: false
  - name: peertube
    disabled: false
  # creative/people engines (People mode)
  - name: deviantart
    disabled: false
  - name: artstation
    disabled: false
  - name: 500px
    disabled: false
  - name: pixiv
    disabled: false
  - name: flickr
    disabled: false
  - name: goodreads
    disabled: false
  - name: hackernews
    disabled: false
  - name: vimeo
    disabled: false
  - name: dailymotion
    disabled: false